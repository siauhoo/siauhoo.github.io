# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: System info
        run: |
          echo "=== OS ==="
          cat /etc/os-release 2>/dev/null || cat /System/Version.plist 2>/dev/null
          echo "=== Ruby ==="
          ls -la /usr/bin/ruby /usr/local/bin/ruby 2>/dev/null || echo "no system ruby"
          which ruby || echo "ruby not in PATH"
          ruby --version 2>/dev/null || echo "ruby version failed"
          echo "=== Bundler ==="
          which bundle || echo "bundle not found"
          bundle --version 2>/dev/null || echo "bundler version failed"
          echo "=== Gemfile ==="
          cat $GITHUB_WORKSPACE/Gemfile
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install gems
        run: |
          echo "=== Ruby after setup ==="
          ruby --version
          echo "=== Bundler after setup ==="
          bundle --version
          echo "=== Bundle install ==="
          bundle install 2>&1 || true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site/"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5